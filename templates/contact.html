{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="section-panel"><h2>Contact Us / Report a Waste Problem</h2><form method="post">{% for n,p in [('name','Name'),('email','Email'),('phone','Phone'),('subject','Subject')] %}<input class="form-control mb-3" name="{{n}}" placeholder="{{p}}" {% if n!='phone' %}required{% endif %}>{% endfor %}<textarea class="form-control mb-3" name="message" rows="6" placeholder="Message" required></textarea><button class="btn btn-success">Send Message</button></form></div></div>{% endblock %}
