{% extends 'base.html' %}{% block content %}<div class="auth"><div class="section-panel"><h2>Create account</h2><form method="post"><input class="form-control mb-3" name="name" placeholder="Full Name" required><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="phone" placeholder="Phone"><input class="form-control mb-3" name="password" type="password" placeholder="Password (6+)" required><input class="form-control mb-3" name="confirm_password" type="password" placeholder="Confirm Password" required><button class="btn btn-success w-100">Sign up</button></form></div></div>{% endblock %}
