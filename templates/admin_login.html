{% extends 'base.html' %}
{% block title %}Admin Login • EcoMind AI{% endblock %}
{% block content %}
<div class="auth"><
  <div class="section-panel">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="fa-solid fa-shield-halved"></i></div>
      <h2>Admin Login</h2>
      <p class="text-muted">Separate administrator access</p>
    </div>
    <form method="post">
      <label class="form-label">Admin Email</label>
      <input class="form-control mb-3" name="email" type="email" placeholder="admin@example.com" required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" name="password" type="password" placeholder="Enter admin password" required>
      <button class="btn btn-success w-100" type="submit">
        <i class="fa-solid fa-shield-halved me-2"></i>Login as Admin
      </button>
    </form>
    <p class="mt-3 text-center">
      <a href="{{url_for('login')}}">← User Login</a>
    </p>
  </div>
</div>
{% endblock %}
