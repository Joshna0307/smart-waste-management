{% extends 'base.html' %}{% block content %}<div class="container py-5"><h2>Notifications</h2><div class="section-panel mt-4">{% for n in notifications %}<div class="activity"><div><b>{{n.title}}</b><p>{{n.message}}</p></div>{% if not n.is_read %}<form method="post" action="{{url_for('notification_read',nid=n.id)}}"><button class="btn btn-sm btn-outline-success">Mark read</button></form>{% endif %}</div>{% else %}<p>No notifications.</p>{% endfor %}</div></div>{% endblock %}
