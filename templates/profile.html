{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="section-panel"><h2>{{user.name}}</h2><p>{{user.email}} • {{user.phone or 'No phone'}}</p><p>Environmental points: <b>{{user.environmental_points}}</b></p><form method="post" enctype="multipart/form-data"><input class="form-control mb-3" name="name" value="{{user.name}}" required><input class="form-control mb-3" name="phone" value="{{user.phone or ''}}"><input class="form-control mb-3" type="file" name="profile_image" accept="image/*"><button class="btn btn-success">Save changes</button></form></div></div>{% endblock %}
